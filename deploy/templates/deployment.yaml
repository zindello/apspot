{{- if not (has (int .Values.replicas) (list 0 1)) }}
{{- fail "replicas must be 0 or 1: one gateway per callsign on APRS-IS" }}
{{- end }}
# One pod, never two at once: Recreate stops the old pod before it starts a new one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: apspot-aprs
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: apspot-aprs
    spec:
      automountServiceAccountToken: false
      # Off a lost node in 30 seconds, not Kubernetes' default 5 minutes (the owner, 2 November
      # 2026: "Once it's dead it's dead"). The gateway has no volume, so its replacement starts at
      # once on another node. Counted from when Kubernetes marks the node unreachable or not ready,
      # itself about 50 seconds after the node goes quiet. Accepted with it: a node that's only cut
      # off from the control plane, not dead, keeps its pod running until it's back, so for that
      # long two gateways may be signed in to APRS-IS as one callsign.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # The image writes nothing; nobody (65534) is enough.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ required "image.tag is written by CI" .Values.image.tag }}"
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
