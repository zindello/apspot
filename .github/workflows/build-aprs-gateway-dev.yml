name: Build APRS Gateway Container (dev)

# Dev counterpart to build-aprs-gateway.yml. Builds apspot-aprs:dev from the
# dev branch and triggers a Portainer redeploy of the apspot-aprs stack —
# which includes the apspot-dev service (defined in zindello/internal-server's
# stacks/apspot-aprs/docker-compose.yml).
#
# Runs only on the zindello/apspot self-hosted runner (runner-apspot in
# internal-server's github-runner stack) — never on GitHub-hosted runners,
# so the image is always built on the target server and never pushed to
# any registry. The :latest tag is reserved for prod (main branch); this
# workflow only ever tags :dev.

on:
  push:
    branches:
      - dev
    paths:
      - "docker/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -f docker/DockerfileAPSPOT -t apspot-aprs:dev docker/

      - name: Redeploy apspot-aprs stack
        run: |
          stack_id=$(curl -sk -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            "${{ secrets.PORTAINER_URL }}/api/stacks" \
            | jq -r '.[] | select(.Name == "apspot-aprs") | .Id')
          if [[ -z "$stack_id" ]]; then
            echo "apspot-aprs stack not found in Portainer yet — deploy it from internal-server first"
            exit 1
          fi
          response=$(curl -sk -X PUT \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.PORTAINER_URL }}/api/stacks/${stack_id}/git/redeploy?endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
            -d "{\"pullImage\":false,\"prune\":false,\"repositoryAuthentication\":true,\"repositoryUsername\":\"${{ secrets.GIT_USERNAME }}\",\"repositoryPassword\":\"${{ secrets.GIT_TOKEN }}\"}")
          echo "Response: $response"
          echo "$response" | jq -e '.Id' > /dev/null || { echo "Deploy failed"; exit 1; }
          # Force-update the dev service to pick up the freshly built :dev image.
          # The Portainer git/redeploy above recreates the whole stack from the
          # compose file; this nudge ensures the dev container restarts with the
          # new image rather than reusing a cached one.
          docker service update --force apspot-aprs_apspot-dev
